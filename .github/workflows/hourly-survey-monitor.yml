name: Hourly Hercules Survey Monitor

# Every hour: sign in headless with the Mailosaur monitor account, create a survey from a random
# AI prompt, validate it against config/hourlyMonitorExpectations.js, and alert on any failure.
# A failed check fails this job, so GitHub's own failure notification fires too.
on:
  schedule:
    # Two slots an hour: GitHub can delay or skip a scheduled run, so :37 is a fallback for :07.
    # The gate job below makes sure at most one monitor run starts per ~hour.
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch:

concurrency:
  group: hourly-survey-monitor
  cancel-in-progress: false   # never cut a run short; an overlapping run waits

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Skip this slot if another run of this workflow started in the last 50 minutes.
          recent=$(gh run list -R "${{ github.repository }}" --workflow hourly-survey-monitor.yml --limit 10 \
            --json databaseId,createdAt --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select((now - (.createdAt | fromdateiso8601)) < 3000)] | length")
          if [ "${recent:-0}" -gt 0 ]; then echo "A run started in the last 50 min; skipping this slot."; echo "run=false" >> "$GITHUB_OUTPUT";
          else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  monitor:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Google Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: Create survey and validate (headless)
        env:
          CI: true
          HERCULES_URL: https://hercules.works
          # Mailosaur server from https://mailosaur.com/app/servers/i3nehdds
          MAILOSAUR_SERVER_ID: i3nehdds
          MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
          HERCULES_MONITOR_EMAIL: ${{ secrets.HERCULES_MONITOR_EMAIL }}       # optional; default hercules-monitor@i3nehdds.mailosaur.net
          HERCULES_MONITOR_PASSWORD: ${{ secrets.HERCULES_MONITOR_PASSWORD }}
          # 'false' = reuse the fixed account (HERCULES_MONITOR_EMAIL/PASSWORD). 'true' = new Mailosaur account
          # every run; needs every confirmation email to reach Mailosaur (failed 9-10 Nov).
          MONITOR_FRESH_ACCOUNT: 'false'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Alerts: Google Chat space incoming webhook
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          GCHAT_MENTIONS: ${{ secrets.GCHAT_MENTIONS }}
        run: node scripts/hourlySurveyMonitor.js

      - name: Summary
        if: always()
        run: |
          f=reports/monitor/latest.json
          if [ -f "$f" ]; then
            node -e "const r=require('./$f');console.log('## Monitor: '+r.status+'\n\n| Check | Status | Detail |\n|---|---|---|\n'+r.checks.map(c=>'| '+c.name+' | '+c.status+' | '+String(c.detail||'').replace(/\|/g,'/')+' |').join('\n')+'\n\nChat: '+(r.facts.chatUrl||'-')+'  \nSurvey: '+(r.facts.surveyUrl||'-'))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Monitor: no result produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survey-monitor-${{ github.run_id }}
          path: |
            reports/monitor/
            test-results/monitor/
          retention-days: 7
          if-no-files-found: ignore
