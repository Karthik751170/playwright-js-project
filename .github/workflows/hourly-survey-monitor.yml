name: Hourly Hercules Survey Monitor

# Every hour, headless on GitHub: sign in with the monitor account, run each monitor group in its
# own parallel job, then build ONE HTML report and post it to the Google Chat space.
# The space gets the report when the tests ran (PASS, WARN or FAIL). A job that failed before its tests
# finished (crash, timeout, cancel) posts nothing there. A failed check still fails its job, so GitHub's
# own failure notification still fires.
on:
  schedule:
    # Two slots an hour: GitHub can delay or skip a scheduled run, so :37 is a fallback for :07.
    # The gate job below makes sure at most one monitor run starts per ~hour.
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Skip this slot if another run of this workflow started in the last 50 minutes.
          recent=$(gh run list -R "${{ github.repository }}" --workflow hourly-survey-monitor.yml --limit 10 \
            --json databaseId,createdAt --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select((now - (.createdAt | fromdateiso8601)) < 3000)] | length")
          if [ "${recent:-0}" -gt 0 ]; then echo "A run started in the last 50 min; skipping this slot."; echo "run=false" >> "$GITHUB_OUTPUT";
          else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  monitor:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: monitor (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        # basic  = login → prompt → brief → create survey → checks
        # quickq = Quick Question: validation, wording checks, step 2 (never launched), rename / duplicate / delete
        # core, logic, manage are built but stay off until they pass end to end.
        group: [basic, quickq]
    concurrency:
      group: hourly-survey-monitor-${{ matrix.group }}
      cancel-in-progress: false   # never cut a run short; an overlapping run waits
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Google Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: Run monitor group (headless)
        env:
          CI: true
          MONITOR_GROUP: ${{ matrix.group }}
          HERCULES_URL: https://hercules.works
          # Mailosaur server from https://mailosaur.com/app/servers/i3nehdds
          MAILOSAUR_SERVER_ID: i3nehdds
          MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
          HERCULES_MONITOR_EMAIL: ${{ secrets.HERCULES_MONITOR_EMAIL }}       # optional; default hercules-monitor@i3nehdds.mailosaur.net
          HERCULES_MONITOR_PASSWORD: ${{ secrets.HERCULES_MONITOR_PASSWORD }}
          # 'false' = reuse the fixed account above. 'true' = new Mailosaur account every run; needs
          # every confirmation email to reach Mailosaur (failed on 9-10 Nov).
          MONITOR_FRESH_ACCOUNT: 'false'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # No Google Chat post from the group jobs: the report job below posts the report (and only the report).
          GCHAT_WEBHOOK_URL: ''
        run: node scripts/hourlySurveyMonitor.js

      - name: Summary
        if: always()
        run: |
          f=reports/monitor/latest.json
          if [ -f "$f" ]; then
            node -e "
              const { results } = require('./' + process.argv[1]);
              const esc = s => String(s || '').replace(/\|/g, '/').replace(/\n/g, ' ');
              for (const r of results) {
                let md = '## ' + r.group + ': ' + r.status + '\n\n';
                if ((r.defects || []).length) md += '### 🐞 Defects\n' + r.defects.map(d => '- **' + esc(d.name) + '** — ' + esc(d.detail)).join('\n') + '\n\n';
                md += '| Check | Status | Type | Detail |\n|---|---|---|---|\n' + r.checks.map(c => '| ' + esc(c.name) + ' | ' + c.status + ' | ' + (c.kind || '') + ' | ' + esc(c.detail).slice(0, 220) + ' |').join('\n');
                md += '\n\nChat: ' + (r.facts && r.facts.chatUrl || '-') + '\n\n';
                console.log(md);
              }" "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ${{ matrix.group }}: no result produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survey-monitor-${{ matrix.group }}-${{ github.run_id }}
          path: |
            reports/monitor/
            test-results/monitor/
          retention-days: 7
          if-no-files-found: ignore

  report:
    needs: [gate, monitor]
    # After the groups, pass or fail; skipped when the gate skipped this slot.
    if: ${{ always() && needs.gate.outputs.run == 'true' }}
    name: report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        continue-on-error: true   # no artifacts = the groups died early; the post step then stays silent
        with:
          pattern: survey-monitor-*
          path: downloaded

      - name: Build the HTML report
        run: |
          mkdir -p reports/monitor/run
          # <artifact>/reports/monitor/<timestamp>/<group>/result.json + evidence/ -> one folder per group.
          for f in $(find downloaded -name result.json -path '*/*/*/result.json' 2>/dev/null); do
            g=$(basename "$(dirname "$f")"); cp -R "$(dirname "$f")" "reports/monitor/run/$g"
          done
          ls reports/monitor/run
          if [ -n "$(ls -A reports/monitor/run)" ]; then node scripts/monitorFeatureReport.js reports/monitor/run; fi

      - name: Upload the HTML report
        id: html
        uses: actions/upload-artifact@v4
        with:
          name: monitor-html-report-${{ github.run_id }}
          path: reports/monitor/run/
          retention-days: 14
          if-no-files-found: ignore

      - name: Post the report to Google Chat (only when the tests ran)
        env:
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          GCHAT_MENTIONS: ${{ secrets.GCHAT_MENTIONS }}   # mentioned only when a test FAILED
          EXPECTED_GROUPS: basic,quickq
          REPORT_URL: ${{ steps.html.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/postMonitorReport.js reports/monitor/run
