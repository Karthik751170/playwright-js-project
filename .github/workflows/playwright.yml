name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'deploy-free-100-users'
        type: choice
        options:
          - deploy-free-100-users
          - validate-logics
          - survey-test
          - all

jobs:
  test:
    name: Run E2E Test Suite
    timeout-minutes: 120
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers & System Deps
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          CI: true
        run: |
          if [ "${{ github.event.inputs.test_suite }}" = "validate-logics" ]; then
            npx playwright test tests/ValidateHerculesLogics.spec.js --reporter=list,html
          elif [ "${{ github.event.inputs.test_suite }}" = "survey-test" ]; then
            npx playwright test tests/SurveyTest.spec.js --reporter=list,html
          elif [ "${{ github.event.inputs.test_suite }}" = "all" ]; then
            npx playwright test tests/DeploySurvey_Free100Users.spec.js tests/ValidateHerculesLogics.spec.js --reporter=list,html
          else
            npx playwright test tests/DeploySurvey_Free100Users.spec.js --reporter=list,html
          fi

      - name: Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
