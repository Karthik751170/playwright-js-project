<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin CMS - Ajay Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0f1c; color: white; margin: 0; padding: 40px; }
        .container { max-width: 900px; margin: 0 auto; background: #12182b; padding: 40px; border-radius: 12px; }
        h1, h2 { color: #d4af37; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 0.9rem; }
        input, textarea { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 6px; font-family: inherit; }
        .btn { background: #d4af37; color: #000; padding: 12px 24px; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .btn:hover { background: #f1c40f; }
        .card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 20px; border-radius: 8px; margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h1>Portfolio CMS Editor</h1>
            <a href="/" style="color:#d4af37;">View Live Site</a>
        </div>
        <p style="color:#94a3b8; margin-bottom:40px;">Edit the JSON directly to update any section of the website.</p>

        <!-- CMS Editor -->
        <div class="card">
            <h2>1. Edit Portfolio Content (JSON)</h2>
            <textarea id="json-editor" rows="25" style="font-family:monospace; font-size:0.9rem;"></textarea>
            <button class="btn" id="save-json-btn" style="margin-top:20px;">Save Content</button>
            <div id="json-status" style="margin-top:10px; font-weight:bold;"></div>
        </div>

        <!-- Video Uploader -->
        <div class="card">
            <h2>2. Upload Home Screen Video</h2>
            <form id="video-form">
                <div class="form-group">
                    <label>Video Title</label>
                    <input type="text" id="v-title" required>
                </div>
                <div class="form-group">
                    <label>Brief Description</label>
                    <textarea id="v-desc" rows="2" required></textarea>
                </div>
                <div class="form-group">
                    <label>Select Video File (.mp4)</label>
                    <input type="file" id="v-file" accept="video/mp4" required>
                </div>
                <button type="submit" class="btn" id="v-btn">Upload Video</button>
                <div id="v-status" style="margin-top:10px; font-weight:bold;"></div>
            </form>
        </div>
    </div>

    <script>
        // Load JSON
        async function loadData() {
            try {
                const res = await fetch('/api/content');
                const data = await res.json();
                document.getElementById('json-editor').value = JSON.stringify(data, null, 2);
            } catch (e) {
                console.error('Failed to load JSON');
            }
        }
        loadData();

        // Save JSON
        document.getElementById('save-json-btn').addEventListener('click', async () => {
            const status = document.getElementById('json-status');
            try {
                const parsed = JSON.parse(document.getElementById('json-editor').value);
                const res = await fetch('/api/content', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(parsed)
                });
                if (res.ok) {
                    status.textContent = 'Successfully saved!';
                    status.style.color = '#4CAF50';
                }
            } catch (e) {
                status.textContent = 'Invalid JSON Format!';
                status.style.color = '#f44336';
            }
        });

        // Upload Video
        document.getElementById('video-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('v-btn');
            const status = document.getElementById('v-status');
            
            const formData = new FormData();
            formData.append('title', document.getElementById('v-title').value);
            formData.append('description', document.getElementById('v-desc').value);
            formData.append('video', document.getElementById('v-file').files[0]);

            btn.disabled = true;
            status.textContent = 'Uploading...';
            status.style.color = '#d4af37';

            try {
                const res = await fetch('/api/upload-video', { method: 'POST', body: formData });
                if (res.ok) {
                    status.textContent = 'Video uploaded! It will now appear on the home screen.';
                    status.style.color = '#4CAF50';
                    document.getElementById('video-form').reset();
                    loadData(); // reload json to reflect new video
                }
            } catch (e) {
                status.textContent = 'Upload failed.';
                status.style.color = '#f44336';
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
