name: Playwright E2E Tests (Single Test Execution)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Test file to run'
        required: true
        default: 'tests/DeploySurvey_Free100Users.spec.js'
        type: string

jobs:
  test-single:
    name: Run Deploy Survey (Free 100 Users)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Headed Test in Virtual Display
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
          MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}
          CI: true
        run: |
          TEST_FILE="${{ github.event.inputs.test_file || 'tests/DeploySurvey_Free100Users.spec.js' }}"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npx playwright test "$TEST_FILE" --headed --reporter=list,html,github

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-deploy-free-100-users
          path: |
            playwright-report/
            test-results/
          retention-days: 14


